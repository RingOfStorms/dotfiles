# Strip oauth2-proxy cookies before the backend (ROUTING-PLAN §4).
set $fleet_cookie $http_cookie;
if ($fleet_cookie ~ "^(.*?)(?:^|;\s*)_oauth2_proxy[A-Za-z0-9_]*=[^;]*(.*)$") {
  set $fleet_cookie $1$2;
}
if ($fleet_cookie ~ "^(.*?)(?:^|;\s*)_oauth2_proxy[A-Za-z0-9_]*=[^;]*(.*)$") {
  set $fleet_cookie $1$2;
}
if ($fleet_cookie ~ "^(.*?)(?:^|;\s*)_oauth2_proxy[A-Za-z0-9_]*=[^;]*(.*)$") {
  set $fleet_cookie $1$2;
}
if ($fleet_cookie ~ "^(.*?)(?:^|;\s*)_oauth2_proxy[A-Za-z0-9_]*=[^;]*(.*)$") {
  set $fleet_cookie $1$2;
}
