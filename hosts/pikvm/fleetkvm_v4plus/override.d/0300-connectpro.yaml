# ConnectPRO KVM switch serial driver, active-port LEDs, and 1-click buttons.
# Copy to /etc/kvmd/override.d/0300-connectpro.yaml on fleetkvm.
#
# Port mapping:
#   Port 1 (pin 0) -> h001
#   Port 2 (pin 1) -> h005
#   Port 3 (pin 2) -> h003
#   Port 4 (pin 3) -> h004

kvmd:
    auth:
        usc:
            users: [root, kvmd]

    gpio:
        drivers:
            connectpro:
                type: connectpro
                device: /dev/ttyUSB0
                speed: 115200
                default_channel: 0

        scheme:
            cp_port1_led:
                driver: connectpro
                pin: 0
                mode: input
            cp_port2_led:
                driver: connectpro
                pin: 1
                mode: input
            cp_port3_led:
                driver: connectpro
                pin: 2
                mode: input
            cp_port4_led:
                driver: connectpro
                pin: 3
                mode: input

            cp_port1_btn:
                driver: connectpro
                pin: 0
                mode: output
                switch: false
            cp_port2_btn:
                driver: connectpro
                pin: 1
                mode: output
                switch: false
            cp_port3_btn:
                driver: connectpro
                pin: 2
                mode: output
                switch: false
            cp_port4_btn:
                driver: connectpro
                pin: 3
                mode: output
                switch: false

        view:
            header:
                title: KVM
            table:
                - [
                    "cp_port1_led|green", "cp_port1_btn|1: h001",
                    "cp_port2_led|green", "cp_port2_btn|2: h005",
                    "cp_port3_led|green", "cp_port3_btn|3: h003",
                    "cp_port4_led|green", "cp_port4_btn|4: h004"
                  ]
