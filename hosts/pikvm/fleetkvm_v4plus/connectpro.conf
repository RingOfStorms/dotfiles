# Optional overrides for /usr/local/bin/connectpro-switch
# Installed at /etc/kvmd/connectpro.conf

# Switching transport:
#   "hotkey" — sends [HOTKEY, HOTKEY, DigitN] over the main USB OTG cable (plugged into ConnectPRO DDM keyboard port).
#   "serial" — sends serial switching strings out SERIAL_DEV (plugged into ConnectPRO RJ45 Serial/Control port).
MODE="serial"

# ConnectPRO active hotkey key name in PiKVM web keymap:
#   "ControlLeft" (ConnectPRO factory default: Ctrl)
#   "ScrollLock"  (recommended if you double-tap Ctrl in editors/games)
#   "ShiftLeft"
#   "CapsLock"
HOTKEY="ControlLeft"

# Used only when MODE="serial" (ConnectPRO does not publish the RS-232 baud/command
# table in the public manual; capture the bytes from the switch's serial output when
# pressing the front-panel button or get the spec sheet from ConnectPRO support, then set):
SERIAL_DEV="/dev/ttyUSB0"
SERIAL_BAUD=""
SERIAL_CMD_FMT=""
