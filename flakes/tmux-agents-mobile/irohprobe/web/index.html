<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>go-iroh probe</title>
<style>body{font:14px ui-monospace,monospace;padding:1em}[data-status=pass]{background:#e6ffe6}[data-status=fail]{background:#ffe6e6}</style>
<script src="wasm_exec.js"></script></head>
<body><div id="log"><div>loading wasm…</div></div>
<script>
const go = new Go();
const t0 = performance.now();
WebAssembly.instantiateStreaming(fetch("client.wasm"), go.importObject).then(r => {
  const d = document.createElement("div");
  d.textContent = "wasm loaded in " + Math.round(performance.now() - t0) + " ms";
  document.getElementById("log").appendChild(d);
  go.run(r.instance);
}).catch(e => { document.getElementById("log").append("wasm load failed: " + e); document.body.dataset.status = "fail"; });
</script></body></html>
