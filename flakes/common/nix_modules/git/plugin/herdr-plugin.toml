id = "nixos.git-worktree-setup"
name = "Git Worktree Setup"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Apply configured ignored-file links and bootstrap command to newly created Git worktrees"
platforms = ["linux"]

[[events]]
on = "worktree.created"
command = ["bash", "./bootstrap.sh"]
